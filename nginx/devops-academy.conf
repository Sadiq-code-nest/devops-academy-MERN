# nginx/devops-academy.conf
# Nginx reverse proxy config for DevOps Academy
# Copy to: /etc/nginx/sites-available/devops-academy
# Enable: sudo ln -s /etc/nginx/sites-available/devops-academy /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;   # replace with your domain or server IP

    # ── Frontend (React build) ─────────────────────────────
    root /var/www/devops-academy-ui;
    index index.html;

    location / {
        # React Router support — all paths served by index.html
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ──────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Security headers ───────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";

    # ── Gzip compression ───────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    # ── Static asset caching ───────────────────────────────
    location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
    }
}
